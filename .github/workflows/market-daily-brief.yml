name: 每日市场简报

on:
  schedule:
    # A股收盘后（北京时间 16:20，UTC 08:20），周一到周五
    - cron: "20 8 * * 1-5"
    # 美股收盘后补一份全球视角（北京时间次日 06:30，UTC 22:30），周一到周五
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      with_llm:
        description: 是否调用 LLM 生成综述
        type: boolean
        default: false
      notify:
        description: 是否推送
        type: boolean
        default: true

concurrency:
  group: market-daily-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-daily-brief
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-daily-brief/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 自检
        run: |
          pip install pytest
          python -m pytest

      - name: 生成报告
        env:
          YUQUE_NAMESPACE: ${{ secrets.YUQUE_NAMESPACE }}
          YUQUE_TOKEN: ${{ secrets.YUQUE_TOKEN }}
          # 没有语雀超级会员时用 Cookie 兜底，约两周需更新一次
          YUQUE_COOKIE: ${{ secrets.YUQUE_COOKIE }}
          YUQUE_BASE_URL: ${{ secrets.YUQUE_BASE_URL }}
          YUQUE_PUBLIC: ${{ secrets.YUQUE_PUBLIC }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS="--json"
          if [ -n "$LLM_API_KEY" ]; then ARGS="$ARGS --llm"; fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || \
             [ "${{ inputs.notify }}" = "true" ]; then ARGS="$ARGS --notify"; fi
          PYTHONPATH=src python -m mdbrief $ARGS

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: market-daily-brief/reports/
          retention-days: 30

      - name: 提交报告到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
          else
            git commit -m "chore: 市场简报 $(date -u +%Y-%m-%d)"
            git push
          fi
