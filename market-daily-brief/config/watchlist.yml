  # 不设 benchmark，超额列自动回落到 cross_reference_benchmark（沪深300），用于观察大类资产轮动
  - name: 大类资产
    market: 商品汇率
    provider: yahoo
    instruments:
      - { symbol: "GC=F", name: COMEX黄金, kind: 商品, keywords: [黄金, 金价, 避险] }
      - { symbol: "CL=F", name: WTI原油, kind: 商品, keywords: [原油, 油价, OPEC] }
      - { symbol: "HG=F", name: COMEX铜, kind: 商品, keywords: [铜价, 铜, 需求] }
      - { symbol: "DX-Y.NYB", name: 美元指数, kind: 汇率, keywords: [美元指数, 美元] }
      - { symbol: "CNY=X", name: 美元离岸人民币, kind: 汇率, keywords: [人民币, 汇率, 贬值, 升值] }
      - { symbol: "^TNX", name: 美债10年期收益率, kind: 利率, keywords: [美债, 收益率, 加息, 降息] }
