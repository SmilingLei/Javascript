      - { symbol: "^STI", name: 新加坡海峡时报指数, kind: 指数, keywords: [新加坡, 海峡时报] }
      - { symbol: "^JKSE", name: 印尼雅加达指数, kind: 指数, keywords: [印尼, 雅加达, 镍] }
      - { symbol: "^KLSE", name: 马来西亚KLCI, kind: 指数, keywords: [马来西亚, 吉隆坡] }
