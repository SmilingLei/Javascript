# 观察列表：按分组维护，组内标的继承组的 market / provider / benchmark 设置。
# provider: tencent(A股、港股实时) / yahoo(全球指数、个股)
# benchmark: 引用 benchmarks 下的键，用于计算超额收益
# history_symbol: 当主代码的历史K线数据稀疏时，用该代码计算区间涨跌（报告中会标注）

benchmarks:
  cn:
    symbol: sh000300
    name: 沪深300
    provider: tencent
  hk:
    symbol: "^HSI"
    name: 恒生指数
    provider: yahoo
  us:
    symbol: "^GSPC"
    name: 标普500
    provider: yahoo

# 报告中所有非A股标的额外再跟沪深300对比一次，便于做全球轮动判断
cross_reference_benchmark: cn

groups:
  - name: 宽基指数
    market: A股
    provider: tencent
    benchmark: cn
    instruments:
      - { symbol: sh510300, name: 沪深300ETF, keywords: [沪深300, 大盘, 权重股] }
      - { symbol: sh510050, name: 上证50ETF, keywords: [上证50, 核心资产] }
      - { symbol: sh510500, name: 中证500ETF, keywords: [中证500, 中盘] }
      - { symbol: sh512100, name: 中证1000ETF, keywords: [中证1000, 小盘股, 微盘] }
      - { symbol: sz159915, name: 创业板ETF, keywords: [创业板, 成长股] }
      - { symbol: sh588000, name: 科创50ETF, keywords: [科创板, 科创50, 硬科技] }

  - name: 科技成长
    market: A股
    provider: tencent
